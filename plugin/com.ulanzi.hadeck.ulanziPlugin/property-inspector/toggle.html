<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HA Toggle</title>
  <link rel="stylesheet" href="../libs/common-html/css/uspi.css">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="uspi-wrapper">
    <div id="hadeck-connection"></div>

    <form id="property-inspector" autocomplete="off">
      <div class="uspi-heading" data-localize>pi.heading.key</div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.entity</div>
        <input class="uspi-item-value" type="text" name="entityId" id="entityId" spellcheck="false"
               data-localize="pi.entity.placeholder" placeholder="pi.entity.placeholder">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.label</div>
        <input class="uspi-item-value" type="text" name="label" maxlength="24"
               data-localize="pi.label.placeholder" placeholder="pi.label.placeholder">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.onText</div>
        <input class="uspi-item-value" type="text" name="onText" maxlength="8"
               data-localize="pi.onText.placeholder" placeholder="pi.onText.placeholder">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.offText</div>
        <input class="uspi-item-value" type="text" name="offText" maxlength="8"
               data-localize="pi.offText.placeholder" placeholder="pi.offText.placeholder">
      </div>

      <div id="hadeck-icon-section"></div>

      <div class="uspi-heading" data-localize>pi.longPress.heading</div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.longPress</div>
        <select class="uspi-item-value" name="longPress" id="longPress">
          <option value="edit" data-localize="pi.longPress.edit">pi.longPress.edit</option>
          <option value="disabled" data-localize="pi.longPress.disabled">pi.longPress.disabled</option>
          <option value="entity" data-localize="pi.longPress.entity">pi.longPress.entity</option>
          <option value="service" data-localize="pi.longPress.service">pi.longPress.service</option>
        </select>
      </div>
      <div class="hadeck-hint" data-mode="edit" data-localize>pi.longPress.editHint</div>
      <div class="uspi-item" data-mode="entity">
        <div class="uspi-item-label" data-localize>pi.longPress.entityId</div>
        <input class="uspi-item-value" type="text" name="longPressEntityId" id="longPressEntityId" spellcheck="false"
               data-localize="pi.entity.placeholder" placeholder="pi.entity.placeholder">
      </div>
      <div class="uspi-item" data-mode="service">
        <div class="uspi-item-label" data-localize>pi.service.domain</div>
        <input class="uspi-item-value" type="text" name="longPressDomain" spellcheck="false" placeholder="light">
      </div>
      <div class="uspi-item" data-mode="service">
        <div class="uspi-item-label" data-localize>pi.service.name</div>
        <input class="uspi-item-value" type="text" name="longPressServiceName" spellcheck="false" placeholder="turn_on">
      </div>
      <div class="uspi-item" data-mode="service">
        <div class="uspi-item-label" data-localize>pi.service.target</div>
        <input class="uspi-item-value" type="text" name="longPressTarget" spellcheck="false" placeholder="light.kitchen">
      </div>
      <div class="uspi-item" data-mode="service">
        <div class="uspi-item-label" data-localize>pi.service.data</div>
        <input class="uspi-item-value" type="text" name="longPressData" id="longPressData" spellcheck="false" placeholder='{"brightness_pct": 100}'>
      </div>
      <div class="tip error hidden" id="longPressDataError" data-localize>error.invalidJson</div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.longPress.ms</div>
        <input class="uspi-item-value" type="number" name="longPressMs" min="300" max="2000" step="50" placeholder="500">
      </div>
    </form>
  </div>

  <script src="../libs/common-html/js/constants.js"></script>
  <script src="../libs/common-html/js/eventEmitter.js"></script>
  <script src="../libs/common-html/js/timers.js"></script>
  <script src="../libs/common-html/js/utils.js"></script>
  <script src="../libs/common-html/js/ulanziApi.js"></script>
  <script src="shared.js"></script>
  <script>
    const modeSelect = document.getElementById('longPress');
    const dataInput = document.getElementById('longPressData');
    const dataError = document.getElementById('longPressDataError');

    // Shows only the fields of the selected long-press behaviour (FR-037).
    function showMode() {
      document.querySelectorAll('[data-mode]').forEach((el) => {
        el.classList.toggle('hidden', el.dataset.mode !== modeSelect.value);
      });
    }

    function validateData() {
      let ok = true;
      if (dataInput.value.trim()) {
        try {
          const parsed = JSON.parse(dataInput.value);
          ok = parsed !== null && typeof parsed === 'object' && !Array.isArray(parsed);
        } catch (e) {
          ok = false;
        }
      }
      dataError.classList.toggle('hidden', ok || modeSelect.value !== 'service');
    }

    HADeck.mountConnectionBlock('#hadeck-connection');
    // Feature 003: icon, on/off colours, "Show icon" (before bindForm so the fields exist).
    HADeck.mountIconSection('#hadeck-icon-section', { showToggle: true, offColor: true, entityInput: document.getElementById('entityId') });
    HADeck.bindForm('#property-inspector', {
      onLoad: () => {
        if (!modeSelect.value) modeSelect.value = 'edit';
        showMode();
        validateData();
      },
    });
    modeSelect.addEventListener('change', () => {
      showMode();
      validateData();
    });
    dataInput.addEventListener('input', validateData);
    showMode();
    // Domains the HA Toggle supports (FR-010).
    const toggleDomains = ['light', 'switch', 'fan', 'cover', 'media_player', 'climate', 'input_boolean'];
    HADeck.mountEntityPicker(document.getElementById('entityId'), { domains: toggleDomains });
    HADeck.mountEntityPicker(document.getElementById('longPressEntityId'), { domains: toggleDomains });
    $UD.connect(HADeck.ACTION_PREFIX + 'toggle');
  </script>
</body>
</html>
