<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HA Service Call</title>
  <link rel="stylesheet" href="../libs/common-html/css/uspi.css">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="uspi-wrapper">
    <div id="hadeck-connection"></div>

    <form id="property-inspector" autocomplete="off">
      <div class="uspi-heading" data-localize>pi.heading.service</div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.label</div>
        <input class="uspi-item-value" type="text" name="label" maxlength="24"
               data-localize="pi.label.placeholder" placeholder="pi.label.placeholder">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.service.domain</div>
        <input class="uspi-item-value" type="text" name="domain" spellcheck="false" placeholder="light">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.service.name</div>
        <input class="uspi-item-value" type="text" name="service" spellcheck="false" placeholder="turn_on">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.service.target</div>
        <input class="uspi-item-value" type="text" name="target" id="target" spellcheck="false" placeholder="light.kitchen, light.desk">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label" data-localize>pi.service.data</div>
        <textarea class="uspi-item-value" name="data" id="data" rows="4" spellcheck="false" placeholder='{"brightness_pct": 100}'></textarea>
      </div>
      <div class="tip error hidden" id="dataError" data-localize>error.invalidJson</div>
    </form>
  </div>

  <script src="../libs/common-html/js/constants.js"></script>
  <script src="../libs/common-html/js/eventEmitter.js"></script>
  <script src="../libs/common-html/js/timers.js"></script>
  <script src="../libs/common-html/js/utils.js"></script>
  <script src="../libs/common-html/js/ulanziApi.js"></script>
  <script src="shared.js"></script>
  <script>
    const dataInput = document.getElementById('data');
    const dataError = document.getElementById('dataError');

    // Inline validation of the JSON data (the key shows "Invalid" for bad data as well).
    function validateData() {
      let ok = true;
      if (dataInput.value.trim()) {
        try {
          const parsed = JSON.parse(dataInput.value);
          ok = parsed !== null && typeof parsed === 'object' && !Array.isArray(parsed);
        } catch (e) {
          ok = false;
        }
      }
      dataError.classList.toggle('hidden', ok);
    }

    HADeck.mountConnectionBlock('#hadeck-connection');
    HADeck.bindForm('#property-inspector', { onLoad: validateData });
    dataInput.addEventListener('input', validateData);
    $UD.connect(HADeck.ACTION_PREFIX + 'service');
  </script>
</body>
</html>
