name: test

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow so a release is only built from a tested commit.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Single, stable status check for branch protection (.github/rulesets/main.json):
  # green only if every matrix job succeeded.
  all-tests:
    name: All tests passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed or were cancelled: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All test jobs succeeded."
